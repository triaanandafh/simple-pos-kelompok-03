openapi: 3.0.3
info:
  title: Simple POS API
  version: 1.0.0
  description: Dokumentasi API untuk aplikasi Simple POS Kelompok 03.
  contact:
    name: Tim Pengembang Simple POS Kelompok 3 SIB 3G
servers:
  - url: http://localhost:8000
    description: Development server
paths:
  /api/products:
    get:
      summary: Daftar produk (dengan paginasi)
      description: |
        Mengambil daftar produk beserta nama kategorinya. Hasil diurutkan
        berdasarkan nama dan dikembalikan dalam format paginasi Laravel.
        Memerlukan autentikasi menggunakan token Laravel Sanctum.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Nomor halaman yang ingin diambil.
        - in: query
          name: per_page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
          description: |
            Jumlah produk per halaman. Nilai di luar rentang 1–100 dibatasi
            oleh server ke rentang tersebut.
      responses:
        '200':
          description: Daftar produk berhasil diambil dalam format paginasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollection'
        '401':
          description: Tidak terautentikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token akses Laravel Sanctum yang dikirim melalui header Authorization.
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - category
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Beras Premium 5kg"
        price:
          type: integer
          example: 75000
        category:
          type: string
          example: "Sembako"
    ProductCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          nullable: true
          example: 1
        last_page:
          type: integer
          example: 7
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                nullable: true
              label:
                type: string
                example: "1"
              active:
                type: boolean
        path:
          type: string
          format: uri
          example: "http://localhost:8000/api/products"
        per_page:
          type: integer
          example: 15
        to:
          type: integer
          nullable: true
          example: 15
        total:
          type: integer
          example: 100
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
          nullable: true
        last:
          type: string
          format: uri
          nullable: true
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Unauthenticated."
